name=XeWeCore
version=2.1.0
author=Maxim Dokukin
maintainer=Maxim Dokukin
sentence=Modular firmware core for ESP32: serial console, command line, typed NVS storage, helpers and a module framework.
paragraph=Include <XeWeCore.h> and use the parts on their own (xewe::SerialPort, xewe::Cli, xewe::Nvs) or as a whole through XeWeOs: modules that each own a $group of commands and an NVS namespace, settings declared once as a table, and a JSON settings schema for tools.
